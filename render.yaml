services:
  # 1. Backend FastAPI Web Service
  - type: web
    name: agentnet-backend
    runtime: python
    plan: free
    rootDir: agentnet/backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ENVIRONMENT
        value: production

  # 2. Frontend React Vite Static Site
  - type: web
    name: agentnet-frontend
    runtime: static
    plan: free
    rootDir: agentnet/frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
